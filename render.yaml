services:
  - type: web
    name: goalsync-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ESCALATION_CRON
        value: "0 * * * *"
      - key: ESCALATION_THRESHOLD_DAYS
        value: 3
      - key: DUE_SOON_REMINDER_DAYS
        value: 2
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: goalsync-db
          property: connectionString
      - key: CLIENT_URL
        sync: false # set this to your Vercel frontend URL after it's deployed

databases:
  - name: goalsync-db
    plan: free
